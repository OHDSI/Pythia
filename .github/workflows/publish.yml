name: Publish Pythia packages

# Publishes the Pythia frontend to GitHub Packages under @ohdsi:
#   - @ohdsi/pythia-plugin  (frontend: vite SystemJS bundle -> dist/)
# d2e's atlas plugin installs it at image-build time (like @ohdsi/atlas3).
#
# The backend (agent/plugin, shadow-cljs Deno agent) is BUILD-ONLY here:
# since the agents-port it is named @trex/pythia — trex's agents runtime only
# mounts agents plugins under the @trex scope (auth requirement) — but GitHub
# Packages only accepts packages scoped to the repo owner (@ohdsi), so
# GITHUB_TOKEN publishes of @trex/* 403 ("installation does not exist"), and
# renaming the manifest at publish time would produce a package the agents
# runtime refuses to mount. The build still runs on every push (it is the only
# CI coverage of `npm run dist`). Re-enable publishing (matrix `publish` flag)
# once a registry that can host @trex/* is wired in (e.g. the d2e Azure feed
# plus a token secret).
#
# Branch builds publish a prerelease version under the `develop` dist-tag; a
# `v*` git tag publishes that exact version under `latest`.

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pythia-plugin       # frontend
            build_dir: .
            build_cmd: npm run build
            publish_dir: .
            publish: true
          - name: pythia-agent        # backend (shadow-cljs needs a JDK)
            build_dir: agent
            build_cmd: npm run dist
            publish_dir: agent/plugin
            # Build-only: @trex/pythia cannot be published to GitHub Packages
            # under @ohdsi — see the header comment.
            publish: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ohdsi'

      # shadow-cljs (agent build) needs Java; harmless for the frontend build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The agent's sync step (gen-wrappers/gen-instructions) runs under Deno;
      # harmless for the frontend build.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.build_dir }}
        run: |
          npm ci
          ${{ matrix.build_cmd }}

      - name: Compute version + dist-tag
        if: ${{ matrix.publish }}
        id: ver
        working-directory: ${{ matrix.publish_dir }}
        run: |
          BASE="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            DIST_TAG="latest"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            VERSION="${BASE}-${GITHUB_REF_NAME//\//-}.${GITHUB_RUN_NUMBER}.g${SHORT_SHA}"
            DIST_TAG="${GITHUB_REF_NAME//\//-}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.name }}
        if: ${{ matrix.publish }}
        working-directory: ${{ matrix.publish_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --tag "${{ steps.ver.outputs.dist_tag }}"
